version: '3.8'

services:
  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: roblox_game
      MYSQL_USER: gameuser
      MYSQL_PASSWORD: gamepassword
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthconnect", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://gameuser:gamepassword@db:3306/roblox_game
      API_KEY: dev-secret-key-change-in-production
      API_PORT: 3000
      RUST_LOG: debug
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  mariadb_data:
